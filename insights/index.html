:root{--bg:#eef1f4;--panel:#fff;--ink:#14202e;--muted:#5a6878;--line:#d5dce4;--accent:#c26a1b;--bad:#b2382a;color-scheme:light}

*{box-sizing:border-box}

p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:600;font-size:13px}

button{font:600 15px inherit;font-family:inherit;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.nfa{font-size:12px;border-top:1px solid var(--line);padding-top:12px}

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(code){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.data)));
  try{sessionStorage.setItem("tp-insights-code",code)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("go"),err=document.getElementById("err");
  b.disabled=true;b.textContent="Checking...";err.textContent="";
  try{await unlock(document.getElementById("code").value)}
  catch(x){err.textContent="That code is not right. Check it and try again.";b.disabled=false;b.textContent="Open insights";document.getElementById("code").select()}
});
try{const c=sessionStorage.getItem("tp-insights-code");if(c)unlock(c).catch(()=>sessionStorage.removeItem("tp-insights-code"))}catch(e){}
